# CI (kind): the image built from this commit, loaded straight into the
# cluster with `kind load docker-image quickserve:ci`, so nothing is pulled.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../monitoring
  - ../../gateway # HTTPS front door (Phase 9); needs infra/k8s/addons.sh first
  - ../../network-policies # who may talk to whom (Phase 10)
  - ../../tracing # Jaeger: traces (Phase 15)

images:
  - name: quickserve
    newName: quickserve
    newTag: ci
  - name: quickserve-app # the customer app (Phase 13)
    newName: quickserve-app
    newTag: ci
