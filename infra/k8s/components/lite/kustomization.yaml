# The "lite" changes, shared by overlays/lite (your Mac) and overlays/ci-lite
# (CI tests exactly what your Mac runs).
#
# Why: on an 8 GB Mac, Docker Desktop has about 3.8 GB, and minikube gets 3 GB
# of it. Everything QuickServe has grown into (Kubernetes itself, Calico for
# network policies, Envoy Gateway, cert-manager, the app, and the monitoring
# stack) needs more than that. On the first try the cluster ran out of memory,
# swapped, its health checks timed out, pods restarted in a loop, and the
# overload even crashed QuickKart's API in the same Docker. Lite leaves out the
# biggest optional part (monitoring) and runs one API pod.
#
# What lite does NOT have: Prometheus, Grafana, Alertmanager, Mailpit (so no
# dashboards, alert emails or rightsizing report). The full stack is
# overlays/local, and CI tests both.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  # One API pod to start with; the autoscaler may still add a second under load.
  - target:
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  # Grafana isn't deployed, so its route through the gateway goes too.
  - target:
      kind: HTTPRoute
      name: grafana
    patch: |-
      $patch: delete
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: grafana
