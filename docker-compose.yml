# Phase 2: only the database runs in Docker. The app runs on your machine with
# `uvicorn --reload` so you get fast edit-and-retry while learning.
# Phase 5 adds an `api` service built from a Dockerfile.
#
#   docker compose up -d        start PostgreSQL in the background
#   docker compose ps           check it is healthy
#   docker compose down         stop it (data survives in the volume)
#   docker compose down -v      stop it AND delete the data

services:
  db:
    image: postgres:16-alpine        # same major version as CI and (later) AWS RDS
    container_name: quickserve-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres    # local only; real secrets come from a secrets manager in Phase 6
      POSTGRES_DB: quickserve
    ports:
      # Your Mac's port 5434 -> port 5432 inside the container.
      # 5434, not 5432, so QuickServe can run alongside QuickKart, whose
      # databases already use 5432 (main) and 5433 (tests) on the host.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create_test_db.sql:/docker-entrypoint-initdb.d/create_test_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quickserve"]
      interval: 5s
      timeout: 3s
      retries: 10
    # FinOps habit from day one: cap what a container may use. On a laptop this
    # protects your machine; in the cloud, limits are what you pay for.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: quickserve-redis
    ports:
      # 6380 on your Mac -> 6379 in the container, so it can't clash with any
      # other project's Redis on the default port 6379.
      - "6380:6379"
    # --maxmemory: Redis keeps everything in RAM, so cap it. When it's full,
    # volatile-ttl evicts the keys closest to expiring first: menu cache entries
    # (seconds left) go before login counters and logged-out tokens (minutes left).
    # --save "": no snapshots to disk. Everything here is safe to lose.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

volumes:
  pgdata:
