# Included in every location: nginx's add_header in a location replaces, not
# adds to, the ones above it, so each location includes this file itself.
#
# Content-Security-Policy: the browser only runs scripts, loads fonts and makes
# requests to this same origin. Even if someone injected a <script> tag, it
# couldn't load code from elsewhere or send the login token to another site.
# style-src needs 'unsafe-inline' for React's style={{...}} attributes; scripts
# get no such exception.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
