# The background worker: same image, different command, no Service (nobody
# connects to it). One replica is enough; more would also be safe, because the
# job claims orders with FOR UPDATE SKIP LOCKED.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
      annotations:
        prometheus.io/scrape: "true"
    spec:
      # SIGTERM first; the worker finishes its current pass and exits. After
      # 30 s Kubernetes sends SIGKILL.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-migrations
          image: quickserve
          command: ["python", "-m", "scripts.wait_for_migrations", "--timeout", "300"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      containers:
        - name: worker
          image: quickserve
          command: ["python", "-m", "app.worker"]
          ports:
            - name: metrics
              containerPort: 9101
          # Restart the worker if its loop is STUCK: no pass finished in the last
          # 2 minutes (3 x 30 s + margin). A pass that fails (database down) still
          # counts as alive, because a restart can't fix the database.
          livenessProbe:
            exec:
              command: ["python", "-m", "app.worker", "--healthcheck"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 2
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
