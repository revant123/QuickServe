# CI: the same lite setup as your Mac (overlays/lite), with the image built in
# the CI job. CI deploys both this and the full stack (overlays/ci).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../gateway
  - ../../network-policies

components:
  - ../../components/lite

images:
  - name: quickserve
    newName: quickserve
    newTag: ci
