# Two ways to run QuickServe. Both can run next to QuickKart (different ports).
#
# 1) Developing (default): only PostgreSQL and Redis run in Docker. You run the
#    API on your Mac with `uvicorn --reload` (port 8000) so edits apply instantly.
#      docker compose up -d                  start the database and Redis
#      docker compose down                   stop them (data survives in the volume)
#
# 2) The whole stack in containers (profile "app"), the way a server runs it:
#    database, Redis, a one-off migration job, the API (port 8001), the worker
#    and the notifier.
#      docker compose --profile app up -d --build   build the image and start everything
#      docker compose --profile app ps              see what is running
#      docker compose --profile app logs -f api     follow the API's logs
#      docker compose --profile app down            stop everything
#
#   Add -v to any `down` to also delete the database data.

# Settings shared by migrate, api and worker. `x-` blocks are ignored by Docker;
# `&app` names this block and `<<: *app` pastes it into each service.
x-app: &app
  build: .
  profiles: ["app"]
  environment:
    # Inside Docker's network, containers reach each other by service name
    # ("db", "redis") on their normal ports, not the 5434/6380 your Mac uses.
    DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/quickserve
    REDIS_URL: redis://redis:6379/0
    ENVIRONMENT: local               # allows the dev JWT secret; never in production
    LOG_JSON: "true"
  restart: unless-stopped            # come back after a crash or a Docker restart

services:
  db:
    image: postgres:16-alpine        # same major version as CI and (later) AWS RDS
    container_name: quickserve-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres    # local only; real secrets come from a secrets manager in Phase 6
      POSTGRES_DB: quickserve
    ports:
      # Your Mac's port 5434 -> port 5432 inside the container.
      # 5434, not 5432, so QuickServe can run alongside QuickKart, whose
      # databases already use 5432 (main) and 5433 (tests) on the host.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create_test_db.sql:/docker-entrypoint-initdb.d/create_test_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quickserve"]
      interval: 5s
      timeout: 3s
      retries: 10
    # FinOps habit from day one: cap what a container may use. On a laptop this
    # protects your machine; in the cloud, limits are what you pay for.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: quickserve-redis
    ports:
      # 6380 on your Mac -> 6379 in the container, so it can't clash with any
      # other project's Redis on the default port 6379.
      - "6380:6379"
    # --maxmemory: Redis keeps everything in RAM, so cap it. When it's full,
    # volatile-ttl evicts the keys closest to expiring first: menu cache entries
    # (seconds left) go before login counters and logged-out tokens (minutes left).
    # --save "": no snapshots to disk. Everything here is safe to lose.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # ---------- The app (profile "app") ----------
  # migrate, api and worker all run the SAME image built from the Dockerfile;
  # only the command differs. One image means the API and the worker can never
  # run different versions of the code.

  # One-off job: bring the database schema up to date, then exit.
  # In production, migrations run once per deploy, never inside every API
  # container: ten API containers starting together would race each other.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true                  # it exits when done; nothing to health-check

  api:
    <<: *app
    container_name: quickserve-api
    ports:
      # 8001 on your Mac -> 8000 in the container, so it can run at the same
      # time as your `uvicorn --reload` dev server on 8000.
      - "8001:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully   # schema first, then serve
      redis:
        condition: service_healthy
    # The Dockerfile's HEALTHCHECK calls /health inside the container.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  worker:
    <<: *app
    container_name: quickserve-worker
    command: ["python", "-m", "app.worker"]
    # No ports: nobody connects to the worker. It only connects out.
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # The image's HEALTHCHECK asks port 8000, where only the API listens.
    # For the worker it would always fail, so switch it off here.
    healthcheck:
      disable: true
    # `docker compose stop` sends SIGTERM. The worker finishes its current pass
    # and exits; Docker waits this long before SIGKILL.
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Phase 8: delivers outbox events as notifications. Same image, own process.
  notifier:
    <<: *app
    container_name: quickserve-notifier
    command: ["python", "-m", "app.notifier"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true # the image's check asks port 8000, where only the API listens
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M

volumes:
  pgdata:
