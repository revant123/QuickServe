# Continuous Integration: every push and pull request is linted and tested
# against a real PostgreSQL, exactly like on your laptop.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# FinOps for CI: if you push twice quickly, cancel the older run instead of
# paying (in minutes) for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10          # a hung job can't burn minutes forever

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quickserve_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/quickserve_test
      REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # the oldest version we support
          cache: pip                  # reuse downloaded packages between runs

      - name: Install dependencies
        run: pip install -r requirements-dev.lock   # exact versions; see README

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Check models and migrations agree
        # Fails if someone changed a model but forgot to create a migration.
        run: |
          alembic upgrade head
          alembic check

      - name: Tests
        run: pytest -q

  # Phase 5: build the Docker image and run the WHOLE stack exactly as
  # `docker compose --profile app up` does on your Mac, then poke it.
  # Runs in parallel with `test`, so the pipeline doesn't get slower.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Runtime lock matches the tested lock
        # The image installs requirements.lock; the tests ran on requirements-dev.lock.
        # Every runtime pin must appear, at the same version, in the dev lock.
        run: |
          status=0
          for pin in $(grep -v '^#' requirements.lock); do
            grep -qxF "$pin" requirements-dev.lock || { echo "::error::$pin is not in requirements-dev.lock"; status=1; }
          done
          exit $status

      - name: Build the image and start database, Redis, migrations, API and worker
        run: docker compose --profile app up -d --build

      - name: Wait until the API is ready
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8001/health/ready && exit 0
            sleep 2
          done
          echo "::error::API never became ready"
          exit 1

      - name: Smoke test
        run: |
          set -euo pipefail
          # Seed demo data using the same image (a one-off command in the running container)
          docker compose --profile app exec -T api python -m scripts.seed

          # Log in as the demo customer and call a protected endpoint
          TOKEN=$(curl -fsS -X POST http://localhost:8001/api/v1/auth/login \
            -d username=customer@quickserve.dev -d password=customer-pass-123 \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["access_token"])')
          curl -fsS http://localhost:8001/api/v1/users/me -H "Authorization: Bearer $TOKEN"
          echo

          # The container runs as the unprivileged "app" user, not root
          test "$(docker compose --profile app exec -T api whoami)" = "app"

          # The worker started and the migration job finished successfully.
          # Logs go to a file first, not "logs | grep -q": grep -q exits at the first
          # match, the log command then writes into a closed pipe and fails, and
          # pipefail turns that into a failed step. It only shows once the logs are
          # long (the Phase 12 seed makes ~150 notifications), so it hid until then.
          docker compose --profile app logs worker > worker.log
          grep -q "worker started" worker.log
          docker compose --profile app logs notifier > notifier.log
          grep -q "notifier started" notifier.log
          test "$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose --profile app ps -aq migrate)")" = "0"

      - name: Worker stops cleanly on SIGTERM
        run: |
          docker compose --profile app stop worker
          docker compose --profile app logs worker > worker.log
          grep -q "worker stopped cleanly" worker.log

      - name: Image size (FinOps)
        # Registry storage and every deploy's download are paid per GB.
        run: |
          echo "### Docker image size" >> "$GITHUB_STEP_SUMMARY"
          docker image ls --format '| {{.Repository}}:{{.Tag}} | {{.Size}} |' | grep -i api >> "$GITHUB_STEP_SUMMARY"

      - name: Show container logs if something failed
        if: failure()
        run: docker compose --profile app logs --no-color

      - name: Clean up
        if: always()
        run: docker compose --profile app down -v

  # Phase 5b: publish the image to GitHub Container Registry (ghcr.io).
  # Only after BOTH other jobs pass, and only pushes to main actually publish.
  # On pull requests it still builds (no push), so a broken publish step shows
  # up in review instead of after the merge.
  publish:
    needs: [test, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Least privilege: this job alone may write packages, and nothing else.
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/quickserve   # registry names must be lowercase
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4

      # QEMU lets an Intel/AMD runner build the ARM version too. ARM matters for
      # Apple Silicon Macs and for AWS Graviton servers, which cost less per hour.
      - uses: docker/setup-qemu-action@v3
        if: env.PUBLISH == 'true'

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # short-lived, made for this run; no secret to store

      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers from earlier runs: faster builds, fewer CI minutes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: env.PUBLISH == 'true'
        run: |
          {
            echo "### Published image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Pull it: \`docker pull ${IMAGE}:sha-${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Phase 6: check the Terraform code. No AWS account or credentials needed:
  # `terraform test` uses mock providers that invent fake IDs instead of
  # calling AWS. Nothing is created and nothing is billed.
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"   # same version as the README asks you to install
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff infra

      - name: Validate and test every stack and module
        run: |
          set -euo pipefail
          for dir in infra/bootstrap infra/envs/dev infra/modules/*/; do
            echo "::group::$dir"
            # -backend=false: don't touch the S3 state bucket; CI has no AWS access.
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
            terraform -chdir="$dir" test -no-color
            echo "::endgroup::"
          done

      - name: Lock files cover Linux, Mac and Windows
        # A lock file made on one OS only would make `terraform init` fail on the others.
        run: |
          for f in infra/bootstrap/.terraform.lock.hcl infra/envs/dev/.terraform.lock.hcl; do
            test "$(git status --porcelain "$f")" = "" || { echo "::error::$f changed during init: run terraform providers lock"; exit 1; }
          done

  # Phase 7: run the whole app on a real (throwaway) Kubernetes cluster.
  # kind = "Kubernetes in Docker": a full cluster inside one container, gone
  # when the job ends. Same manifests as minikube on your Mac.
  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Twice, in parallel: the full stack (what a server runs) and "lite" (what
    # an 8 GB Mac runs: no monitoring, one API pod). Both must work.
    strategy:
      fail-fast: false
      matrix:
        overlay: [ci, ci-lite]
    env:
      KIND_VERSION: v0.33.0
      NS: quickserve

    steps:
      - uses: actions/checkout@v4

      - name: Validate the manifests against the Kubernetes schema
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          # Gateway API, Envoy Gateway and cert-manager objects have no built-in
          # schema here (they're CRDs): they are skipped, and the API server
          # validates them against the installed CRDs when deploy.sh applies them.
          for overlay in local lite ci ci-lite; do
            kubectl kustomize "infra/k8s/overlays/$overlay" | ./kubeconform -strict -ignore-missing-schemas -summary -
          done

      - name: Check the Prometheus and Alertmanager configs, unit-test the rules
        if: matrix.overlay == 'ci'
        run: |
          docker run --rm -v "$PWD/infra/k8s/monitoring:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v3.16.0 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/infra/k8s/monitoring:/etc/prometheus:ro" -w /etc/prometheus --entrypoint promtool \
            prom/prometheus:v3.16.0 test rules rules_test.yml
          docker run --rm -v "$PWD/infra/k8s/monitoring:/etc/alertmanager:ro" --entrypoint amtool \
            prom/alertmanager:v0.35.0 check-config /etc/alertmanager/alertmanager.yml

      - name: Build this commit's image
        run: docker build -t quickserve:ci .

      - name: Create a kind cluster and load the image into it
        run: |
          curl -sSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind && sudo mv kind /usr/local/bin/kind
          kind create cluster --name quickserve --wait 120s
          kind load docker-image quickserve:ci --name quickserve

      - name: Deploy (add-ons, database, Redis, migration Job, apps, monitoring, gateway)
        run: infra/k8s/deploy.sh infra/k8s/overlays/${{ matrix.overlay }}

      - name: Smoke test from inside the cluster
        run: |
          kubectl -n $NS exec deploy/api -- python -m scripts.seed
          infra/k8s/smoke.sh check
          test "$(kubectl -n $NS exec deploy/api -- id -u)" = "10001"   # not root
          kubectl -n $NS get hpa,pdb

      - name: Rolling update with zero failed requests
        run: |
          infra/k8s/smoke.sh watch 60 > watch.json &
          WATCHER=$!
          sleep 5
          kubectl -n $NS rollout restart deployment/api
          kubectl -n $NS rollout status deployment/api --timeout=180s
          wait $WATCHER || { echo "::error::requests failed during the rolling update: $(cat watch.json)"; exit 1; }
          echo "During the rollout: $(cat watch.json)"

      - name: Self-healing - delete an API pod, Kubernetes replaces it
        run: |
          POD=$(kubectl -n $NS get pods -l app.kubernetes.io/name=api -o jsonpath='{.items[0].metadata.name}')
          kubectl -n $NS delete pod "$POD" --wait=false
          kubectl -n $NS rollout status deployment/api --timeout=120s
          infra/k8s/smoke.sh check

      - name: Monitoring - Prometheus scrapes the pods, Grafana has the dashboard, alerts reach email
        if: matrix.overlay == 'ci'
        run: |
          infra/k8s/smoke.sh monitoring
          # The worker's liveness probe (its heartbeat) never had to restart it.
          test "$(kubectl -n $NS get pods -l app.kubernetes.io/name=worker -o jsonpath='{.items[0].status.containerStatuses[0].restartCount}')" = "0"

      - name: FinOps - rightsizing report (requests vs real usage)
        if: matrix.overlay == 'ci'
        run: |
          # Retried a few times: the CPU numbers need a few scrapes before they exist.
          for attempt in 1 2 3 4 5 6; do
            python3 infra/k8s/rightsizing.py --window 15m && exit 0
            sleep 20
          done
          exit 1

      - name: Front door - HTTPS, redirects, host routing, real client IP, edge rate limit
        run: infra/k8s/gateway_check.sh

      - name: Network policies - allowed connections work, forbidden ones fail
        run: infra/k8s/netpol_check.sh

      - name: FinOps - memory used by the whole cluster (full vs lite)
        run: |
          # The kind "node" is one Docker container holding ALL of Kubernetes:
          # the control plane, the network plugin, the add-ons and our pods.
          # Its memory is what a laptop's Docker Desktop has to provide.
          usage=$(docker stats --no-stream --format '{{.MemUsage}}' quickserve-control-plane)
          echo "Cluster memory with overlays/${{ matrix.overlay }}: $usage"
          echo "Cluster memory with overlays/${{ matrix.overlay }}: **$usage**" >> "$GITHUB_STEP_SUMMARY"
          kubectl get pods -A --no-headers | awk '{print $1}' | sort | uniq -c

      - name: Show the cluster if something failed
        if: failure()
        run: |
          kubectl -n $NS get all,pvc,events --sort-by=.metadata.creationTimestamp || true
          kubectl -n $NS describe pods || true
          for d in api worker notifier prometheus grafana alertmanager mailpit; do kubectl -n $NS logs deploy/$d --all-containers --tail=100 || true; done
          kubectl -n $NS logs job/migrate --tail=100 || true
          kubectl -n $NS describe gateway,httproute,certificate,backendtrafficpolicy,clienttrafficpolicy || true
          kubectl -n $NS get networkpolicy || true
          kubectl -n kube-system logs -l app=kindnet --tail=50 || true
          kubectl -n envoy-gateway-system get all || true
          kubectl -n envoy-gateway-system logs deploy/envoy-gateway --tail=100 || true
          kubectl -n envoy-gateway-system logs deploy/quickserve-gateway --all-containers --tail=100 || true
          kubectl -n cert-manager logs deploy/cert-manager --tail=100 || true
