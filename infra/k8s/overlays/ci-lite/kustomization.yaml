# CI: the same lite setup as your Mac (overlays/lite), with the image built in
# the CI job. CI deploys both this and the full stack (overlays/ci).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../gateway
  - ../../network-policies
  - ../../tracing # Jaeger (Phase 15): small enough for lite

components:
  - ../../components/lite

images:
  - name: quickserve
    newName: quickserve
    newTag: ci
  - name: quickserve-app # the customer app (Phase 13)
    newName: quickserve-app
    newTag: ci
