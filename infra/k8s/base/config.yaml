# Non-secret settings, passed to the app as environment variables, exactly like
# `environment:` in docker-compose.yml. Secrets are in a separate Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  ENVIRONMENT: local
  LOG_JSON: "true"
  # "redis" is the name of the Redis Service: Kubernetes DNS turns it into an address.
  REDIS_URL: redis://redis:6379/0
  # Phase 9: requests now arrive through the gateway (Envoy), so the TCP peer
  # the API sees is the Envoy pod, not the customer. Envoy appends the address
  # it saw to X-Forwarded-For; the API believes that LAST entry, and only when
  # the request comes from this network (the pod network of minikube and kind,
  # where Envoy runs). See app/core/client_ip.py for why only the last entry.
  TRUSTED_PROXY_CIDRS: "10.244.0.0/16"
  # Phase 15: spans go to Jaeger (infra/k8s/tracing). OpenTelemetry's standard
  # variable names: another backend is a one-line change here.
  TRACING_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
