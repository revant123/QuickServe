# Your Mac (minikube). Uses the image CI published to ghcr.io.
# To run a specific version, change newTag to an immutable tag such as sha-3073e30.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../monitoring
  - ../../gateway # HTTPS front door (Phase 9); needs infra/k8s/addons.sh first
  - ../../network-policies # who may talk to whom (Phase 10)

images:
  - name: quickserve
    newName: ghcr.io/revant123/quickserve
    newTag: main

# Always check ghcr.io for a newer `main` image (see the file for why).
patches:
  - path: pull-always.yaml
