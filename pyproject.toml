[project]
name = "quickserve"
version = "0.2.0"
description = "Food ordering platform: a learning project for backend, ORM, DevOps and FinOps"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations/versions"]  # generated by Alembic

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "B008",   # FastAPI's Depends()/Query() in defaults is the intended pattern
  "E501",   # line length is the formatter's job (ruff format)
  "UP042",  # (str, Enum) is deliberate: clear for learners, works the same with SQLAlchemy
]
