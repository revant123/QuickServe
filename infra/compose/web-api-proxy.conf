# Docker Compose only (Phase 13): send /api from the app's nginx to the API
# container. In Kubernetes the Gateway does this, so the image doesn't contain it.
location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 15s;
}
