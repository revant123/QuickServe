# nginx for the customer app (Phase 13). It serves static files only; the API
# is reached through the same hostname, routed by the Gateway (Kubernetes) or
# by an extra file mounted into /etc/nginx/extra/ (Docker Compose).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off; # don't advertise the nginx version

    # Compress text on the fly. Hashed JS and CSS shrink to about a third.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
    gzip_vary on;

    # For the Kubernetes probes and the Docker HEALTHCHECK.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Files with a content hash in their name (index-CErYbmiG.js): a new build
    # gets new names, so these can be cached for a year and never revalidated.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must always be checked, or phones would keep pointing at the
    # previous build's file names after a deploy.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # A single-page app: /orders/123 is a screen, not a file. Unknown paths
        # get index.html and React Router shows the right screen.
        try_files $uri /index.html;
    }

    include /etc/nginx/extra/*.conf;
}
