# One-off migration Job: `alembic upgrade head`, once per deploy. The API and
# worker pods wait for it in their init containers (scripts/wait_for_migrations.py).
#
# A Job's pod template can't be changed after creation, so deploy.sh deletes
# the previous Job before applying a new one.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  # If PostgreSQL isn't ready yet the migration fails; Kubernetes retries with
  # a growing delay (10 s, 20 s, 40 s, ...) up to 6 times.
  backoffLimit: 6
  # Delete the finished Job (and its pod) after 10 minutes instead of keeping it forever.
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: quickserve
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
