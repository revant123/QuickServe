# The smoke tests (infra/k8s/smoke.sh) run in short-lived pods labelled
# app.kubernetes.io/name=smoke-test. Until Phase 10 they ran inside the worker
# pod, which would have meant letting the WORKER reach the API, Grafana and
# the rest, just for tests. A test client is a client: it gets its own label
# and exactly the access it needs, and nothing else gets it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smoke-test
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: smoke-test }
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: api } }
      ports:
        - { protocol: TCP, port: 8000 }
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports:
        - { protocol: TCP, port: 9090 }
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: grafana } }
      ports:
        - { protocol: TCP, port: 3000 }
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: alertmanager } }
      ports:
        - { protocol: TCP, port: 9093 }
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: mailpit } }
      ports:
        - { protocol: TCP, port: 8025 }
    # The gateway, like a customer would (Envoy listens on 10080/10443 inside
    # its pod; the Service maps 80/443 to those).
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system }
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: quickserve
      ports:
        - { protocol: TCP, port: 10080 }
        - { protocol: TCP, port: 10443 }
