# Routes: which requests go where. Matching is by hostname first, then path.
#
# 1. Anything on plain HTTP gets a permanent redirect to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
spec:
  parentRefs:
    - name: quickserve
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# 2. The API: /api (and the health checks and docs) on quickserve.localhost.
#    Since Phase 13 everything else on this hostname goes to the customer app
#    (route 2b). Gateway API picks the longest matching prefix, so /api/... comes
#    here and / goes there. One hostname means the browser never makes a
#    cross-origin request: no CORS configuration anywhere.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs:
    - name: quickserve
      sectionName: https
  hostnames:
    - quickserve.localhost
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
        - path: { type: PathPrefix, value: /health }
        - path: { type: PathPrefix, value: /docs }
        - path: { type: PathPrefix, value: /redoc }
        - path: { type: Exact, value: /openapi.json }
      backendRefs:
        # The same Service the pods already had. Only port 80 (the app) is in
        # it; the metrics port isn't, so /metrics can't be reached from outside.
        - name: api
          port: 80
      # A request that takes longer than this gets a 504 from Envoy instead of
      # holding a connection open forever.
      timeouts:
        request: 15s
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              # HSTS: "only ever talk to me over HTTPS". Browsers remember it
              # for max-age seconds. 5 minutes while learning; a real site uses
              # a year (31536000) once it's sure HTTPS works everywhere.
              - name: Strict-Transport-Security
                value: max-age=300
              - name: X-Content-Type-Options
                value: nosniff
---
# 2b. The customer app (Phase 13): every other path on the same hostname.
#     Its own security headers (CSP and friends) come from its nginx.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  parentRefs:
    - name: quickserve
      sectionName: https
  hostnames:
    - quickserve.localhost
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: web
          port: 80
      timeouts:
        request: 15s
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=300
---
# 3. Grafana on another hostname, same Gateway, same IP, same certificate.
# Host-based routing: the browser sends the hostname (in TLS's SNI and in the
# Host header), and Envoy picks the route by it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - name: quickserve
      sectionName: https
  hostnames:
    - grafana.quickserve.localhost
  rules:
    - backendRefs:
        - name: grafana
          port: 3000
---
# Jaeger's UI (Phase 15). Like Grafana here, it has no login: fine on a
# laptop, never on the internet (put it behind SSO or a VPN).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jaeger
spec:
  parentRefs:
    - name: quickserve
      sectionName: https
  hostnames:
    - jaeger.quickserve.localhost
  rules:
    - backendRefs:
        - name: jaeger
          port: 16686
